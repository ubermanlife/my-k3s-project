version: 3.3

services:
  # Database
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    # Docker compose creates a network for all services in this file automatically

  # Python app
  mini-app:
    build: .
    container_name: python_app
    environment:
      DB_HOST: postgres_db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
    # Python will start AFTER database starts
    depends_on:
      - postgres-db

 # === Monitoring services ===

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - postgres-db

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - 3000:3000
    depends_on:
      - prometheus
