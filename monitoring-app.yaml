apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-monitoring
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 58.x.x  # Стабильная версия
    helm:
      values: |
        grafana:
          adminPassword: "admin"  # Пароль для входа в Графану
          service:
            type: NodePort
            nodePort: 32000       # Откроем Grafana наружу на порту 32000
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  # ArgoCD сам создаст namespace "monitoring"
